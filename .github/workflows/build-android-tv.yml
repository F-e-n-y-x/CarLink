name: Build DiPlay Android TV APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build standalone Android TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # This mirrors the repository's existing Android CI setup and installs the exact
      # platform/build-tools/NDK versions required by the current Gradle files.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate CarPlay secrets
        shell: bash
        env:
          MFI_IDENTITY: ${{ secrets.MFI_IDENTITY_PK8_BASE64 }}
          MFI_CERTIFICATE: ${{ secrets.MFI_CERTIFICATE_P7B_BASE64 }}
        run: |
          if [ -z "$MFI_IDENTITY" ]; then
            echo "ERROR: Missing repository secret MFI_IDENTITY_PK8_BASE64"
            exit 1
          fi
          if [ -z "$MFI_CERTIFICATE" ]; then
            echo "ERROR: Missing repository secret MFI_CERTIFICATE_P7B_BASE64"
            exit 1
          fi

      - name: Restore standalone CarPlay authentication assets
        shell: bash
        env:
          MFI_IDENTITY: ${{ secrets.MFI_IDENTITY_PK8_BASE64 }}
          MFI_CERTIFICATE: ${{ secrets.MFI_CERTIFICATE_P7B_BASE64 }}
        run: |
          AUTH_DIR="$RUNNER_TEMP/diplay-auth"
          mkdir -p "$AUTH_DIR/offline-mfi"

          printf '%s' "$MFI_IDENTITY" | base64 --decode > "$AUTH_DIR/offline-mfi/identity.pk8"
          printf '%s' "$MFI_CERTIFICATE" | base64 --decode > "$AUTH_DIR/offline-mfi/certificate.p7b"

          chmod 600 "$AUTH_DIR/offline-mfi/identity.pk8" "$AUTH_DIR/offline-mfi/certificate.p7b"
          test -s "$AUTH_DIR/offline-mfi/identity.pk8"
          test -s "$AUTH_DIR/offline-mfi/certificate.p7b"

      - name: Run unit tests
        env:
          DIPLAY_AUTH_ASSETS_DIR: ${{ runner.temp }}/diplay-auth
        run: |
          ./gradlew \
            :shared:testDebugUnitTest \
            :common:testDebugUnitTest \
            --stacktrace \
            --no-daemon

      - name: Build standalone CarPlay APK
        env:
          DIPLAY_AUTH_ASSETS_DIR: ${{ runner.temp }}/diplay-auth
        run: |
          ./gradlew \
            :mobile:assembleStandaloneDebug \
            --stacktrace \
            --no-daemon

      - name: Find generated APK
        shell: bash
        run: |
          echo "Generated APK files:"
          find mobile/build/outputs -type f -name "*.apk" -print

      - name: Prepare APK artifact
        shell: bash
        run: |
          mkdir -p artifacts
          APK_FILE=$(find mobile/build/outputs -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK was generated"
            exit 1
          fi
          cp "$APK_FILE" artifacts/DiPlay-0.2.9-Android-TV-DPad.apk
          ls -lh artifacts/DiPlay-0.2.9-Android-TV-DPad.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-Android-TV-DPad
          path: artifacts/DiPlay-0.2.9-Android-TV-DPad.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            mobile/build/reports/
          if-no-files-found: ignore
          retention-days: 7
