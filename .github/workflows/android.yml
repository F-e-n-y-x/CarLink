name: Android CI

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Check, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gradle's daemon is pinned to JDK 25 (gradle/gradle-daemon-jvm.properties, from DiPlay).
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      # The engines pin different NDKs (DiAuto 29, DiPlay 28.2). Retried: sdkmanager downloads
      # occasionally arrive corrupt on hosted runners.
      - name: Install pinned SDK components
        run: |
          for attempt in 1 2 3; do
            sdkmanager "platforms;android-36" "platforms;android-37.0" "build-tools;35.0.0" "build-tools;36.0.0" \
              "ndk;29.0.14206865" "ndk;28.2.13676358" "cmake;3.22.1" && exit 0
            echo "sdkmanager attempt $attempt failed; retrying in 15s..." >&2
            sleep 15
          done
          exit 1

      # Two engines share one resource table; an unreviewed name clash silently breaks a screen.
      - name: Check engine resource collisions
        run: python3 scripts/resource_collisions.py --check

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: >
          ./gradlew --continue
          :app:testDebugUnitTest
          :androidauto:testGithubDebugUnitTest
          :carplay-shared:testDebugUnitTest
          :carplay-common:testDebugUnitTest

      - name: Lint and assemble
        run: ./gradlew :app:lintDebug :app:assembleDebug

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carlink-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
